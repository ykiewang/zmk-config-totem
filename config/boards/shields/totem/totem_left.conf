# zmk-keybeacon: report layer (name + index), modifier state, connection
# status, active profile, and battery (central + peripheral) over the host
# BLE connection. Central (left) half only; the module's cmake guard also
# requires CONFIG_ZMK_BLE + CONFIG_ZMK_SPLIT_ROLE_CENTRAL.
CONFIG_ZMK_KEYBEACON=y

# KBP 1.1 sub-options (present since zmk-keybeacon v1.1.x, both default y
# upstream). The Connectivity path is now ZMK-revision-safe: the module probes
# the installed ZMK for zmk_endpoints_selected() / zmk_endpoint_get_selected()
# at CMake configure time (see compatibility.yaml) instead of hard-coding one.
CONFIG_ZMK_KEYBEACON_CONNECTIVITY=y
CONFIG_ZMK_KEYBEACON_BATTERY=y

# KBP 1.2 sub-option (zmk-keybeacon >= 1.2.0, pinned as revision: v1.2.0 in
# west.yml). Per-connection Host-Link characteristic AA440AA4-… so each host
# reads its OWN profile slot and can tell "in use on this computer" from
# "active on another computer". Default y (depends on CONNECTIVITY); pinned
# explicitly to document that this config relies on it.
CONFIG_ZMK_KEYBEACON_HOST_LINK=y

# Required for the central to fetch the peripheral (right) battery level, so
# the Battery characteristic can report both halves. ZMK default is n.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
