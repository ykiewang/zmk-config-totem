# zmk-keybeacon: report active layer (name + index) and modifier state
# over the host BLE connection. Central (left) half only; the module's
# cmake guard also requires CONFIG_ZMK_BLE + CONFIG_ZMK_SPLIT_ROLE_CENTRAL.
CONFIG_ZMK_KEYBEACON=y

# KBP 1.1 sub-options default to y upstream but are out of scope for this
# feature, and the Connectivity path currently calls zmk_endpoints_selected(),
# which was removed from ZMK main. Disable them so revision: main builds clean.
CONFIG_ZMK_KEYBEACON_CONNECTIVITY=n
CONFIG_ZMK_KEYBEACON_BATTERY=n
