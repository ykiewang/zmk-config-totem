CONFIG_ZMK_USB_LOGGING=n

### KEYBEACON
# zmk-keybeacon v1.1.3 — exposes active layer + modifiers (KBP 1.0 AA1)
# and, on this version, connectivity + per-side battery (KBP 1.1 AA2/AA3).
# The AA2/AA3 sub-options (CONFIG_ZMK_KEYBEACON_CONNECTIVITY /
# CONFIG_ZMK_KEYBEACON_BATTERY) default y, so simply enabling the module
# turns everything on. The .cmake guard links keybeacon.c only into the
# central image (totem_left), so no action needed in totem_right.conf.
CONFIG_ZMK_KEYBEACON=y

### Split battery reporting
# Required for KeyBeacon's AA2.split_flags.right_online and AA3.right_percent
# on the central image. Without this, the central never subscribes to the
# peripheral's BAS, so zmk_peripheral_battery_state_changed is never raised,
# `connected` in keybeacon.c stays false, and the floating panel shows the
# right half as offline even while it is working normally.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Intentionally left disabled: enabling PROXY=y would mirror the peripheral
# battery into a second standard BAS service, which makes the macOS
# Bluetooth menu show two battery entries (left + right). KeyBeacon's AA3
# characteristic already covers that need, so we skip the duplicate menu entry.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
